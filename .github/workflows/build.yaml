name: Build

on: [ push, pull_request ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ~4.4.2

      - name: Build
        run: |
          cmake -B build -DRADIAL_VERSION=0.1.0
          cmake --build build --config Release

      - name: Run
        run: ./build/radial --version
